server:
  port: ${SERVER_PORT:8090}
  tomcat:
    max-threads: 200
    accept-count: 100

spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    com.ticoin: ${LOG_LEVEL_APP:INFO}
    org.springframework: WARN
    org.hibernate: WARN
