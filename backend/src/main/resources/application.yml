server:
  port: ${SERVER_PORT:8090}
  shutdown: graceful
  compression:
    enabled: true

spring:
  application:
    name: ticoin-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ticoin}
    username: ${DB_USER:ticoin}
    password: ${DB_PASSWORD:ticoin}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=60s
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

info:
  app:
    name: ticoin-backend
    version: 0.3.0
    description: 주식 & 코인 실시간 대시보드 백엔드

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

ticoin:
  cors:
    allowed-origins: ${TICOIN_CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}
  websocket:
    broadcast-interval-ms: ${TICOIN_WS_INTERVAL_MS:15000}
  alert:
    check-interval-ms: ${TICOIN_ALERT_INTERVAL_MS:20000}
  api:
    coingecko:
      base-url: ${COINGECKO_URL:https://api.coingecko.com/api/v3}
    yahoo:
      base-url: ${YAHOO_URL:https://query1.finance.yahoo.com}
    cryptocompare:
      base-url: ${CRYPTOCOMPARE_URL:https://min-api.cryptocompare.com}
    coinmarketcap:
      base-url: ${CMC_URL:https://pro-api.coinmarketcap.com/v1}
      api-key: ${CMC_API_KEY:}

logging:
  level:
    com.ticoin: ${LOG_LEVEL_APP:INFO}
    org.springframework.web: INFO
    org.hibernate.orm.deprecation: ERROR
