server:
  port: ${SERVER_PORT:8090}
  shutdown: graceful
  compression:
    enabled: true

spring:
  application:
    name: ticoin-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:disabled}
            client-secret: ${GOOGLE_CLIENT_SECRET:disabled}
            scope: openid,profile,email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          kakao:
            client-id: ${KAKAO_CLIENT_ID:disabled}
            client-secret: ${KAKAO_CLIENT_SECRET:disabled}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile_nickname,profile_image,account_email
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ticoin}
    username: ${DB_USER:ticoin}
    password: ${DB_PASSWORD:ticoin}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=60s
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

info:
  app:
    name: ticoin-backend
    version: 0.3.0
    description: 주식 & 코인 실시간 대시보드 백엔드

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

ticoin:
  auth:
    jwt:
      secret: ${TICOIN_JWT_SECRET:change-me-in-production-ticoin-secret-key-please-use-env-var-32b}
      ttl: ${TICOIN_JWT_TTL:P7D}
      issuer: ticoin
    redirect-url: ${TICOIN_AUTH_REDIRECT:http://localhost:5174/auth/callback}
  cors:
    allowed-origins: ${TICOIN_CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}
  websocket:
    broadcast-interval-ms: ${TICOIN_WS_INTERVAL_MS:15000}
  alert:
    check-interval-ms: ${TICOIN_ALERT_INTERVAL_MS:20000}
  api:
    coingecko:
      base-url: ${COINGECKO_URL:https://api.coingecko.com/api/v3}
    yahoo:
      base-url: ${YAHOO_URL:https://query1.finance.yahoo.com}
    cryptocompare:
      base-url: ${CRYPTOCOMPARE_URL:https://min-api.cryptocompare.com}
    coinmarketcap:
      base-url: ${CMC_URL:https://pro-api.coinmarketcap.com/v1}
      api-key: ${CMC_API_KEY:}
    reddit:
      base-url: ${REDDIT_URL:https://www.reddit.com}
    google-news:
      base-url: ${GOOGLE_NEWS_URL:https://news.google.com}
    anthropic:
      base-url: ${ANTHROPIC_URL:https://api.anthropic.com}
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}

logging:
  level:
    com.ticoin: ${LOG_LEVEL_APP:INFO}
    org.springframework.web: INFO
    org.hibernate.orm.deprecation: ERROR
