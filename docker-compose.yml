services:
  postgres:
    image: postgres:16-alpine
    container_name: ticoin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ticoin
      POSTGRES_USER: ticoin
      POSTGRES_PASSWORD: ticoin
    ports:
      - "5433:5432"
    volumes:
      - ticoin-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticoin -d ticoin"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: ticoin-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ticoin
      DB_USER: ticoin
      DB_PASSWORD: ticoin
      TICOIN_CORS_ORIGINS: "http://localhost:5174,http://localhost:3000"
      CMC_API_KEY: ${CMC_API_KEY:-}
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build: ./frontend
    container_name: ticoin-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8090
    ports:
      - "5174:80"

volumes:
  ticoin-pgdata:
